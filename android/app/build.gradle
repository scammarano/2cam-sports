plugins { id 'com.android.application' }
android {
    namespace 'services.twocam.sportscontrol'
    compileSdk 35
    defaultConfig {
        applicationId 'services.twocam.sportscontrol'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '0.2.0-test'
        testInstrumentationRunner 'services.twocam.sportscontrol.SmokeInstrumentation'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }
    lint { abortOnError true }
}
