name: Build Android control APK
on:
  push:
    branches: [main, 'feat/**']
    paths: ['android/**', '.github/workflows/android.yml', 'src/**', 'scripts/android-**']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml', 'src/**', 'scripts/android-**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: sports-debug-signing-v1
      - name: Build and lint Android app
        working-directory: android
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug --stacktrace
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify local service
        run: npm test
      - name: Start emulator service fixture
        run: node scripts/android-fixture.mjs > /tmp/sports-fixture.log 2>&1 &
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android emulator integration test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb install -r android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w services.twocam.sportscontrol.test/services.twocam.sportscontrol.SmokeInstrumentation | tee /tmp/sports-instrumentation.txt
            grep -q SPORTS_ANDROID_SMOKE_PASS /tmp/sports-instrumentation.txt
      - name: Package verified APK
        run: |
          mkdir -p delivery
          cp android/app/build/outputs/apk/debug/app-debug.apk delivery/2cam-sports-control-0.2.0-test.apk
          cp docs/ANDROID_TEST.md delivery/LEEME.md
          cd delivery
          sha256sum 2cam-sports-control-0.2.0-test.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: 2cam-sports-control-0.2.0-test-APK
          path: delivery/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-verification
          path: |
            android/app/build/reports/lint-results-debug.html
            /tmp/sports-instrumentation.txt
          if-no-files-found: ignore
